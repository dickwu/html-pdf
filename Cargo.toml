[package]
name = "ironpress-php"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "ironpress_php"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.12"
lopdf = "0.45"
# Metrics of fonts added to PdfStamper (already in the tree through the engine).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Ironpress core (HTML/CSS/Markdown -> PDF engine). Cargo.lock pins the exact
# commit for reproducible prod builds.
ironpress_core = { package = "ironpress", git = "https://github.com/dickwu/ironpress.git", branch = "main", default-features = false }

[features]
default = []
remote = ["ironpress_core/remote"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
