[package]
name = "ironpress-php"
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "ironpress_php"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.16.3"
lopdf = "0.45"
# Metrics of fonts added to PdfStamper (already in the tree through the engine).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# ironpages engine (HTML/CSS/Markdown -> PDF), the renamed fork of ironpress
# 1.7.0. Local path dependency until github.com/dickwu/ironpages is published;
# then switch to a pinned git dependency so CI and release builds can fetch it:
#   ironpages = { git = "https://github.com/dickwu/ironpages", rev = "<commit>", default-features = false }
ironpages = { path = "../ironpages", default-features = false }

[features]
default = []
remote = ["ironpages/remote"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
