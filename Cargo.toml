[package]
name = "ironpress-php"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "ironpress_php"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.12"
# Ironpress core (HTML/CSS/Markdown -> PDF engine). Cargo.lock pins the exact
# commit for reproducible prod builds.
ironpress_core = { package = "ironpress", git = "https://github.com/dickwu/ironpress.git", branch = "feat/port-unique-work-1.6.0", default-features = false }

[features]
default = []
remote = ["ironpress_core/remote"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
