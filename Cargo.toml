[package]
name = "ironpress-php"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "ironpress_php"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.12"
# GFI-287: depend on the fork carrying the table-cell SVG/img render fix until it lands
# upstream / on crates.io. Cargo.lock pins the exact commit for reproducible prod builds.
ironpress_core = { package = "ironpress", git = "https://github.com/dickwu/ironpress.git", branch = "fix/table-cell-image-svg", default-features = false }

[features]
default = []
remote = ["ironpress_core/remote"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
